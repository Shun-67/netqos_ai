[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# Les tests n'utilisent que des DataFrames construits à la main : ni fichier de
# données, ni base, ni API. La suite doit rester exécutable en quelques secondes,
# pour pouvoir tourner à chaque modification.
filterwarnings =
    error::FutureWarning
    # L'autoencodeur des tests est volontairement bridé (max_iter bas) pour que
    # la suite reste rapide : la non-convergence est attendue, pas un défaut.
    ignore::sklearn.exceptions.ConvergenceWarning
